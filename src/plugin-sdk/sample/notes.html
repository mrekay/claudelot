<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  body{display:flex;flex-direction:column;padding:12px;gap:10px}
  form{display:flex;gap:6px}
  form textarea{flex:1;min-height:38px;max-height:160px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;overflow:auto}
  li{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  li p{flex:1;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
  li time{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  li button{border:0;background:none;color:var(--muted);padding:0 4px}
  li button:hover{color:var(--danger)}
  .empty{color:var(--muted);text-align:center;padding:24px 0}
</style>
</head>
<body>
  <form id="f">
    <textarea id="t" placeholder="Bir not yaz · Ctrl+Enter ile ekle" aria-label="Yeni not"></textarea>
    <button class="primary" type="submit">Ekle</button>
  </form>
  <ul id="list"></ul>
<script src="notes.js"></script>
</body>
</html>
